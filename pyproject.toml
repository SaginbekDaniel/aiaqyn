[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aiaqyn"
version = "0.1.0"
description = "Evidence-grounded requirements auditing with executable contradiction witnesses"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3", "httpx>=0.28,<1", "pypdf>=5,<7", "python-dotenv>=1,<2", "z3-solver>=4.13,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
aiaqyn = "aiaqyn.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.hatch.build.targets.wheel]
packages = ["aiaqyn"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.uv]
package = true
