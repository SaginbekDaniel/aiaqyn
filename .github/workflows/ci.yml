name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.1'
      - run: uv sync --frozen --extra dev --no-editable --python 3.12
      - run: uv run --no-editable pytest -q
      - run: uv run --no-editable ruff check .
      - run: uv run --no-editable ruff format --check .
      - run: uv run --no-editable aiaqyn examples/mini.md reports/demo.md --fixture examples/mini.fixture.json
